
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | NOVA STORE</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
</head>
<body>

<header>
  <a href="index.html" class="logo">NOVA <span>STORE</span></a>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="productos.html">Productos</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="contacto.html">Contacto</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="faq.html">FAQ</a>
    <a href="carrito.html">Carrito (<span class="contador-carrito">0</span>)</a>
  </nav>
</header>

<main class="contenedor">

  <section class="titulo">
    <h1>Nuestros productos</h1>
    <p>Descubre nuestra variedad de productos y encuentra lo que necesitas.</p>
  </section>

  <section class="controles">
    <input
      type="search"
      id="buscar"
      placeholder="Buscar producto..."
    >

    <select id="categoria">
      <option value="">Todas las categorías</option>
      <option value="Electrónica">Electrónica</option>
      <option value="Accesorios">Accesorios</option>
      <option value="Ropa">Ropa</option>
    </select>

    <select id="ordenar">
      <option value="">Ordenar por precio</option>
      <option value="menor">Menor precio</option>
      <option value="mayor">Mayor precio</option>
    </select>

    <select id="disponibilidad">
      <option value="">Todos los productos</option>
      <option value="disponible">Disponibles</option>
      <option value="agotado">Agotados</option>
    </select>
  </section>

  <p id="cantidad-resultados"></p>

  <section id="lista-productos" class="productos-grid">
    <p>Cargando productos...</p>
  </section>

</main>

<footer>
  <p>© 2026 NOVA STORE | Todos los derechos reservados.</p>
  <p>Tu tienda, tu estilo, tu mejor elección.</p>
</footer>
<script src="js/app.js"></script>
<script src="js/productos.js"></script>
</body>
</html>
